[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ripplekg"
version = "0.1.0"
description = "Evidence-aware incremental KG maintenance on ArangoDB"
requires-python = ">=3.11"
dependencies = [
    "python-arango>=8.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "jupyter>=1.0",
    "networkx>=3.2",
    "pyvis>=0.3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ripplekg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
