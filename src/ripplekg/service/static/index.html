<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RippleKG</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg:#15151a; --band:#1d1d24; --panel:#24242c; --line:#373744;
      --fg:#eeeeee; --muted:#a4a4b2; --fresh:#2e8b57; --stale:#d88922;
      --blue:#2f6695; --red:#8b3434;
    }
    * { box-sizing:border-box; }
    body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,sans-serif; }
    header { min-height:44px; padding:10px 16px; display:flex; align-items:center; gap:16px; background:#101014; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:16px; }
    .legend, .muted { color:var(--muted); font-size:12px; }
    .fresh { color:var(--fresh); } .stale { color:var(--stale); }
    .toolbar { display:grid; grid-template-columns: 230px 92px 96px 1fr auto auto auto; gap:8px; align-items:center; padding:10px 16px; background:var(--band); border-bottom:1px solid var(--line); }
    input, select, textarea { width:100%; min-width:0; background:#101014; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:6px 8px; font:inherit; }
    textarea { height:54px; resize:vertical; }
    button { white-space:nowrap; background:#363644; color:var(--fg); border:1px solid #4b4b5e; border-radius:4px; padding:7px 12px; cursor:pointer; }
    button:hover { background:#444456; }
    button.primary { background:var(--blue); border-color:#4479aa; }
    main { flex:1; min-height:0; display:grid; grid-template-columns: 320px minmax(360px,1fr) 430px; }
    aside, #panel { min-height:0; overflow:auto; background:var(--panel); }
    aside { border-right:1px solid var(--line); }
    #panel { border-left:1px solid var(--line); padding:12px; }
    #graph { min-width:0; min-height:0; background:#121217; }
    .section-title { margin:12px 12px 6px; color:var(--muted); font-size:12px; text-transform:uppercase; }
    .sentence { margin:0; padding:8px 12px; border-top:1px solid #30303a; cursor:pointer; }
    .sentence:hover, .sentence.active { background:#30303a; }
    .sentence b { color:#d8d8e0; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th, td { padding:4px 6px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line); }
    code { color:#cfd9c8; overflow-wrap:anywhere; }
    .pill { display:inline-block; min-width:64px; text-align:center; padding:2px 6px; border-radius:3px; font-size:11px; }
    .SKIP { background:#4b4b55; } .PATCH { background:var(--blue); } .REBUILD { background:var(--red); }
    .metric-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0; }
    .metric { background:#1a1a20; border:1px solid var(--line); border-radius:4px; padding:7px; }
    .metric b { display:block; font-size:16px; }
    @media (max-width: 980px) {
      .toolbar { grid-template-columns:1fr 1fr; }
      main { grid-template-columns:1fr; grid-template-rows:210px 360px 1fr; }
      aside, #panel { border:0; border-top:1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>RippleKG</h1>
    <span class="legend">KG graph: <b class="fresh">fresh</b> / <b class="stale">stale</b></span>
    <span id="status" class="legend"></span>
  </header>

  <div class="toolbar">
    <select id="edit_select" onchange="selectEdit()"></select>
    <select id="refresh_mode">
      <option value="immediate">immediate</option>
      <option value="deferred">deferred</option>
    </select>
    <input id="doc_id" value="doc0" />
    <input id="sent_idx" value="0" />
    <textarea id="new_text" placeholder="edited sentence"></textarea>
    <button class="primary" onclick="applyEdit()">Apply edit</button>
    <button onclick="tick()">Tick</button>
    <button onclick="reset()">Reset</button>
  </div>

  <main>
    <aside>
      <div class="section-title">Corpus Sentences</div>
      <div id="sentences"></div>
    </aside>
    <div id="graph"></div>
    <div id="panel"><p class="muted">Choose a demo edit and apply it to see M1, M2, metrics, and freshness.</p></div>
  </main>

  <script>
    const nodes = new vis.DataSet();
    const edges = new vis.DataSet();
    const network = new vis.Network(document.getElementById('graph'), { nodes, edges }, {
      nodes: { shape:'dot', size:13, font:{ color:'#eeeeee', size:12 } },
      edges: { arrows:'to', font:{ color:'#bbbbc8', size:10, strokeWidth:0 }, smooth:true },
      physics: { stabilization:true },
    });
    let edits = [];
    let lastResult = null;

    const color = f => f === 'stale'
      ? { background:'#d88922', border:'#b36d13' }
      : { background:'#2e8b57', border:'#216a42' };
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const status = msg => { document.getElementById('status').textContent = msg; };

    async function loadEdits() {
      edits = await (await fetch('/edits')).json();
      const sel = document.getElementById('edit_select');
      sel.innerHTML = edits.map(e => `<option value="${e.index}">edit ${e.index + 1}: ${esc(e.doc_id)}:${e.sent_idx}</option>`).join('');
      if (edits.length) selectEdit();
    }

    async function loadSentences() {
      const docId = document.getElementById('doc_id').value || 'doc0';
      const rows = await (await fetch(`/sentences?doc_id=${encodeURIComponent(docId)}`)).json();
      document.getElementById('sentences').innerHTML = rows.map(s => `
        <p class="sentence ${Number(document.getElementById('sent_idx').value) === s.idx ? 'active' : ''}"
           onclick="pickSentence(${s.idx})"><b>${s.doc_id}:${s.idx}</b><br>${esc(s.text)}</p>
      `).join('') || '<p class="sentence muted">No sentences loaded.</p>';
    }

    function pickSentence(idx) {
      document.getElementById('sent_idx').value = idx;
      loadSentences();
    }

    function selectEdit() {
      const edit = edits[Number(document.getElementById('edit_select').value)];
      if (!edit) return;
      document.getElementById('doc_id').value = edit.doc_id;
      document.getElementById('sent_idx').value = edit.sent_idx;
      document.getElementById('new_text').value = edit.new_text;
      loadSentences();
      renderPreview(edit);
    }

    async function loadGraph() {
      const g = await (await fetch('/graph')).json();
      nodes.clear(); edges.clear();
      nodes.add(g.nodes.map(n => ({ id:n.id, label:n.label, color:color(n.freshness) })));
      edges.add(g.edges.map(e => ({ id:e.id, from:e.source, to:e.target, label:e.label, color:color(e.freshness) })));
      status(`${g.nodes.length} entities, ${g.edges.length} relations`);
    }

    async function loadMetrics(step = null) {
      const suffix = step ? `?step=${step}` : '';
      return await (await fetch(`/metrics${suffix}`)).json();
    }

    async function applyEdit() {
      const edit = edits[Number(document.getElementById('edit_select').value)];
      const body = {
        doc_id: document.getElementById('doc_id').value,
        sent_idx: Number(document.getElementById('sent_idx').value),
        new_text: document.getElementById('new_text').value,
        intended_triples: edit ? edit.intended_triples : [],
      };
      const mode = document.getElementById('refresh_mode').value;
      lastResult = await (await fetch(`/edit?refresh_mode=${mode}`, {
        method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body),
      })).json();
      const metrics = await loadMetrics(lastResult.step);
      renderResult(lastResult, metrics);
      await loadGraph();
      await loadSentences();
    }

    async function tick() {
      const r = await (await fetch('/tick', { method:'POST' })).json();
      const metrics = await loadMetrics(lastResult?.step ?? null);
      renderTick(r, metrics);
      await loadGraph();
    }

    async function reset() {
      await fetch('/reset', { method:'POST' });
      document.getElementById('panel').innerHTML = '<p class="muted">Schema reset. Re-run ingest before applying demo edits.</p>';
      await loadGraph();
      await loadSentences();
    }

    function renderPreview(edit) {
      document.getElementById('panel').innerHTML = `
        <h2>Selected Edit</h2>
        <p class="muted">${esc(edit.doc_id)}:${edit.sent_idx}</p>
        <p><code>${esc(edit.new_text)}</code></p>
        <h2>Intended Triples</h2>
        <table>${edit.intended_triples.map(t => `<tr><td>${esc(t[0])}</td><td>${esc(t[1])}</td><td>${esc(t[2])}</td></tr>`).join('')}</table>
      `;
    }

    function renderMetrics(metrics) {
      return `
        <div class="metric-grid">
          <div class="metric"><span class="muted">added</span><b>${metrics.evidence_delta.added}</b></div>
          <div class="metric"><span class="muted">removed</span><b>${metrics.evidence_delta.removed}</b></div>
          <div class="metric"><span class="muted">unchanged</span><b>${metrics.evidence_delta.unchanged}</b></div>
          <div class="metric"><span class="muted">cost</span><b>${metrics.cost.actual}</b></div>
        </div>
        <div class="metric-grid">
          <div class="metric"><span class="muted">SKIP</span><b>${metrics.decisions.SKIP}</b></div>
          <div class="metric"><span class="muted">PATCH</span><b>${metrics.decisions.PATCH}</b></div>
          <div class="metric"><span class="muted">REBUILD</span><b>${metrics.decisions.REBUILD}</b></div>
          <div class="metric"><span class="muted">stale</span><b>${metrics.stale.entities + metrics.stale.relations}</b></div>
        </div>`;
    }

    function renderResult(r, metrics) {
      const deltaRows = (r.evidence_delta || []).map(d =>
        `<tr><td>${d.delta_type}</td><td>${d.scope}</td><td><code>${esc(JSON.stringify(d.triple))}</code></td></tr>`).join('');
      const decisionRows = (r.decisions || []).map(d =>
        `<tr><td><span class="pill ${d.decision}">${d.decision}</span></td><td>${d.target_type}:${d.target_id}</td><td>${d.cost}</td></tr>`).join('');
      document.getElementById('panel').innerHTML = `
        <h2>Edit Result · step ${r.step}</h2>
        <p class="muted">${esc(r.edit.doc_id)}:${r.edit.sent_idx} · ${esc(r.edit.refresh_mode)}</p>
        <p>old: <code>${esc(r.edit.old_text ?? '∅')}</code></p>
        <p>new: <code>${esc(r.edit.new_text)}</code></p>
        <h2>Metrics</h2>${renderMetrics(metrics)}
        <h2>M1 Evidence Delta</h2>
        <table><tr><th>type</th><th>scope</th><th>payload</th></tr>${deltaRows || '<tr><td colspan="3" class="muted">(none)</td></tr>'}</table>
        <h2>M2 Decisions</h2>
        <table><tr><th>decision</th><th>target</th><th>cost</th></tr>${decisionRows || '<tr><td colspan="3" class="muted">(none)</td></tr>'}</table>
      `;
    }

    function renderTick(result, metrics) {
      document.getElementById('panel').innerHTML = `
        <h2>Refresh Tick</h2>
        <p><code>${esc(JSON.stringify(result))}</code></p>
        <h2>Metrics</h2>${renderMetrics(metrics)}
      `;
    }

    loadEdits();
    loadSentences();
    loadGraph();
  </script>
</body>
</html>
